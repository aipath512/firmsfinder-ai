# wrangler.toml — FirmsFinder AI v1.0 (2026-10-06) — Cloudflare Worker + static assets
# Numele trebuie să rămână exact „wrangler.toml”; „name” = numele Worker-ului din Cloudflare.
name = "firmsfinder-ai"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
routes = [
  { pattern = "1clic-ia.eu", custom_domain = true },
  { pattern = "firmsfinder.aiventure.ro", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "b2b-romania-db"
database_id = "0d6de488-285f-458b-b4b0-5f9ac913c5f1"
